$kind: http-request
name: http://localhost:8080/
url: http://localhost:8080/api/pet-products
method: POST
body:
  type: json
  content: "{\r

    \    \"productName\": \"Deluxe Dog Bed\",\r

    \    \"description\": \"A comfortable and soft dog bed for large breeds.\",\r

    \    \"price\": 49.99,\r

    \    \"availableStock\": 25,\r

    \    \"category\": \"Beds and Furniture\",\r

    \    \"photo\": \"iVBORw0KGgoAAAANSUhEUgAA...\",\r

    \    \"vendorName\": \"PetCare Supplies\",\r

    \    \"vendorPhone\": \"+1-555-1234\"\r

    }"
scripts:
  - type: afterResponse
    code: "pm.test(\"Response status code is 200\", function () {\r

      \  pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"Response time is less than 200ms\", function () {\r

      \  pm.expect(pm.response.responseTime).to.be.below(200);\r

      });\r

      \r

      pm.test(\"Content-Type header is application/json\", function () {\r

      \    pm.expect(pm.response.headers.get(\"Content-Type\")).to.include(\"application/json\");\r

      });\r

      \r

      pm.test(\"Validate the structure of the response\", function () {\r

      \    const responseData = pm.response.text();\r

      \    \r

      \    pm.expect(responseData).to.include(\"Ticket Booked Successfully\");\r

      });\r

      var template = `\r

      <style type=\"text/css\">\r

      \    .tftable {font-size:14px;color:#333333;width:100%;border-width: 1px;border-color: #87ceeb;border-collapse: collapse;}\r

      \    .tftable th {font-size:18px;background-color:#87ceeb;border-width: 1px;padding: 8px;border-style: solid;border-color: #87ceeb;text-align:left;}\r

      \    .tftable tr {background-color:#ffffff;}\r

      \    .tftable td {font-size:14px;border-width: 1px;padding: 8px;border-style: solid;border-color: #87ceeb;}\r

      \    .tftable tr:hover {background-color:#e0ffff;}\r

      </style>\r

      \r

      <table class=\"tftable\" border=\"1\">\r

      \    <tr>\r

      \        <th>Name</th>\r

      \    </tr>\r

      \    <tr>\r

      \        <td>{{response.name}}</td>\r

      \    </tr>\r

      </table>\r

      `;\r

      \r

      function constructVisualizerPayload() {\r

      \    return {response: pm.response.json()}\r

      }\r

      \r

      pm.visualizer.set(template, constructVisualizerPayload());"
    language: text/javascript
settings: {}
order: 1000
