        - Auth Service
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                newPassword:
                  type: string
            example:
              token: QZj3EqxguTOUfxpjeAfDK8kGh0Iq-juVaoUJ_SQ9qSJ79qmBnJghjC-vQMxc2JApQFcMzs7cOghkkpe5iLmt_w
