            example:
              refreshToken: 9RzMeCYlCM6wR1lvwNiKyG5z8TEIOTilwii2CMSHHMIrMsEHYsXl_no0I8oEj85b4VEPzZD_zR71xGLaznPFUA
  /auth/verify-email:
