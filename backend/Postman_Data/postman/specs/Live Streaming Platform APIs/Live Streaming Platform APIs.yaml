      summary: Verify Email
      responses: {}
      tags:
        - Auth Service
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
            example:
              token: Zk2P4bTdfVL2R5frgLNDC_sJWzLAXhpdex7fdqhoFJkxVhamw_MZ-Otx2NVSELBUiGFd9R429cXfkTejXD5wHg
