    post:
      summary: Login User
      parameters:
        - name: User-Agent
          in: header
          schema:
            type: string
          example: PostmanRuntime /Mac OS X
      responses: {}
      tags:
        - Auth Service
      requestBody:
        content:
          application/json:
            schema:
              type: object
            example: |-
              {
                  "email": "karanop167@gmail.com",
                  "password": "karan167"
              }

              // {
              //     "email": "karantest@gmail.com",
              //     "password": "karanfound"
              // }
