    get:
      summary: Get User By ID
      responses: {}
      tags:
        - User Service
  /internal/users:
    post:
      summary: Create User
      responses: {}
      tags:
        - User Service
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                displayName:
                  type: string
                email:
                  type: string
                  format: email
            example:
              username: rahul
              displayName: Rahul
              email: rahul@test.com
  /users/me/profile:
    patch:
      summary: Update User By ID
      responses: {}
      tags:
        - User Service
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                displayName:
                  type: string
                bio:
                  type: string
                location:
                  type: string
            example:
              username: karanfound3
              displayName: Karan Found 3
              bio: Backend Engineer
              location: Jodhpur
