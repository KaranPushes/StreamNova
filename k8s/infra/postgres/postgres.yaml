apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-db
data:
  init.sql: |
    CREATE DATABASE streaming_auth;
    CREATE DATABASE streaming_users;
    CREATE DATABASE streaming_channels;
    CREATE DATABASE streaming_follows;
    CREATE DATABASE streaming_streams;
    CREATE DATABASE streaming_chat;
    CREATE DATABASE streaming_feed;
    CREATE DATABASE streaming_media;
    CREATE DATABASE streaming_notification;
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:17
        args:
          - -c
          - max_connections=300
          - -c
          - idle_in_transaction_session_timeout=30000
        env:
        - name: POSTGRES_USER
          value: "streaming"
        - name: POSTGRES_PASSWORD
          value: "streaming123"
        - name: POSTGRES_DB
          value: "postgres"
        ports:
        - containerPort: 5432
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
        - name: init-scripts
          mountPath: /docker-entrypoint-initdb.d
      volumes:
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: postgres-pvc
      - name: init-scripts
        configMap:
          name: postgres-init-db
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432
