apiVersion: v1
kind: ConfigMap
metadata:
  name: mediamtx-config
data:
  mediamtx.yml: |
    logLevel: debug
    authMethod: http
    authHTTPAddress: http://stream-service:8086/internal/streams/authenticate
    authHTTPExclude:
      - action: read
      - action: playback
    paths:
      "~^live/(.+)$":
        source: publisher
        runOnOnline: >
          curl -X POST
          http://stream-service:8086/internal/streams/$G1/publish
        runOnOffline: >
          curl -X POST
          http://stream-service:8086/internal/streams/$G1/unpublish
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mediamtx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mediamtx
  template:
    metadata:
      labels:
        app: mediamtx
    spec:
      containers:
      - name: mediamtx
        image: bluenviron/mediamtx:1-ffmpeg
        ports:
        - name: rtmp
          containerPort: 1935
        - name: rtsp
          containerPort: 8554
        - name: api
          containerPort: 8888
        volumeMounts:
        - name: config-volume
          mountPath: /mediamtx.yml
          subPath: mediamtx.yml
      volumes:
      - name: config-volume
        configMap:
          name: mediamtx-config
---
apiVersion: v1
kind: Service
metadata:
  name: mediamtx
spec:
  selector:
    app: mediamtx
  ports:
  - name: rtmp
    port: 1935
    targetPort: 1935
  - name: rtsp
    port: 8554
    targetPort: 8554
  - name: api
    port: 8888
    targetPort: 8888
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-hls-config
data:
  default.conf: |
    server {
        listen 80;
        server_name localhost;

        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;

            # CORS headers
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range' always;
            add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;

            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*';
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
                add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range';
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain; charset=utf-8';
                add_header 'Content-Length' 0;
                return 204;
            }

            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }

            location ~ \.m3u8$ {
                add_header 'Access-Control-Allow-Origin' '*' always;
                add_header Cache-Control no-cache;
            }

            location ~ \.ts$ {
                add_header 'Access-Control-Allow-Origin' '*' always;
                add_header Cache-Control "public, max-age=3600";
            }
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-hls
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-hls
  template:
    metadata:
      labels:
        app: nginx-hls
    spec:
      containers:
      - name: nginx-hls
        image: nginx:alpine
        ports:
        - containerPort: 80
        volumeMounts:
        - name: hls-storage
          mountPath: /usr/share/nginx/html
          readOnly: true
        - name: nginx-config
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
      volumes:
      - name: hls-storage
        persistentVolumeClaim:
          claimName: hls-data-pvc
      - name: nginx-config
        configMap:
          name: nginx-hls-config
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-hls
spec:
  selector:
    app: nginx-hls
  ports:
  - port: 8090
    targetPort: 80
