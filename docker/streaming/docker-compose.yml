services:

  mediamtx:
    build:
      context: ./mediamtx
    container_name: streaming-mediamtx
    ports:
      - "1935:1935"
      - "8554:8554"
      - "8880:8888"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - streaming

  transcoder-service:
    build:
      context: ../..
      dockerfile: docker/streaming/transcoder-service/Dockerfile
    container_name: streaming-transcoder
    ports:
      - "8087:8087"
    volumes:
      - hls-data:/var/www/hls
    depends_on:
      - mediamtx
    networks:
      - streaming

  nginx:
    image: nginx:alpine
    container_name: streaming-hls
    ports:
      - "8090:80"
    volumes:
      - hls-data:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - transcoder-service
    networks:
      - streaming

networks:
  streaming:

volumes:
  hls-data: